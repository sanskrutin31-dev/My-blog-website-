
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h2>MyBlog</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="create-blog.html">Create Blog</a>
        <a href="login.html">Logout</a>
    </nav>
</header>

<section class="hero">
    <h1>My Dashboard</h1>
    <p>Welcome! Manage your blogs here.</p>

    <a href="create-blog.html">
        <button>Create New Blog</button>
    </a>
</section>

<section class="blogs">
    <h2>My Published Blogs</h2>
    <div id="blogList"></div>
</section>

<script>
const blogList = document.getElementById("blogList");

async function loadBlogs() {
    try {
        const response = await fetch("http://localhost:5000/api/blogs");

        if (!response.ok) {
            throw new Error("Failed to load blogs");
        }

        const blogs = await response.json();

        blogList.innerHTML = "";

        if (blogs.length === 0) {
            blogList.innerHTML = "<p>No blogs published yet.</p>";
            return;
        }

        blogs.forEach(function(blog) {
            const card = document.createElement("div");
            card.className = "blog-card";

            const title = document.createElement("h3");
            title.textContent = blog.title;

            const author = document.createElement("p");
            author.textContent = "By: " + blog.author;

            const content = document.createElement("p");
            content.textContent = blog.content;

            const viewButton = document.createElement("button");
            viewButton.textContent = "View Blog";

            viewButton.addEventListener("click", function() {
                window.location.href =
                    "view-blog.html?id=" + encodeURIComponent(blog._id);
            });

            card.appendChild(title);
            card.appendChild(author);
            card.appendChild(content);
            card.appendChild(viewButton);

            blogList.appendChild(card);
        });

    } catch (error) {
        blogList.innerHTML =
            "<p>Unable to load blogs. Please check server.</p>";
        console.error(error);
    }
}

loadBlogs();
</script>

</body>
</html>
