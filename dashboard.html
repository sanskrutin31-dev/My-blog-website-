
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h2>MyBlog</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="create-blog.html">Create Blog</a>
            <a href="#" id="logoutLink">Logout</a>
        </nav>
    </header>

    <section class="hero">

        <h1>My Dashboard</h1>
        <p id="welcomeMessage">Welcome! Manage your blogs here.</p>

        <a href="create-blog.html">
            <button>Create New Blog</button>
        </a>

    </section>

    <section class="blogs">

        <h2>My Published Blogs</h2>
        <div id="blogList"></div>

    </section>

    <script>

        // Check Login Token
        const token = localStorage.getItem("jwtToken");

        if (!token) {
            alert("Please login first!");
            window.location.href = "login.html";
        }

        // Show Logged-in User
        const loggedInUser = localStorage.getItem("loggedInUser");

        if (loggedInUser) {
            const user = JSON.parse(loggedInUser);
            document.getElementById("welcomeMessage").textContent =
                "Welcome " + user.name + "! Manage your blogs here.";
        }

        // Logout Function
        function logout() {

            localStorage.removeItem("jwtToken");
            localStorage.removeItem("loggedInUser");

            alert("Logout Successful!");

            window.location.href = "login.html";
        }

        document.getElementById("logoutLink")
        .addEventListener("click", function(e) {
            e.preventDefault();
            logout();
        });

        // Load User Blogs
        const blogList = document.getElementById("blogList");

        async function loadBlogs() {

            if (!token) return;

            try {

                const response = await fetch(
                    "http://localhost:5000/api/blogs",
                    {
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    }
                );

                if (response.status === 401) {
                    alert("Session expired. Please login again!");
                    logout();
                    return;
                }

                if (!response.ok) {
                    throw new Error("Failed to load blogs");
                }

                const blogs = await response.json();

                blogList.innerHTML = "";

                if (blogs.length === 0) {
                    blogList.innerHTML = "<p>No blogs published yet.</p>";
                    return;
                }

                blogs.forEach(function(blog) {

                    const card = document.createElement("div");
                    card.className = "blog-card";

                    const title = document.createElement("h3");
                    title.textContent = blog.title;

                    const author = document.createElement("p");
                    author.textContent = "By: " + blog.author;

                    const content = document.createElement("p");
                    content.textContent = blog.content;

                    const viewButton = document.createElement("button");
                    viewButton.textContent = "View Blog";

                    viewButton.addEventListener("click", function() {
                        window.location.href =
                            "view-blog.html?id=" + encodeURIComponent(blog._id);
                    });

                    card.appendChild(title);
                    card.appendChild(author);
                    card.appendChild(content);
                    card.appendChild(viewButton);

                    blogList.appendChild(card);

                });

            } catch (error) {

                blogList.innerHTML =
                    "<p>Unable to load blogs. Please check server.</p>";

                console.error(error);

            }
        }

        loadBlogs();

    </script>

</body>
</html>
