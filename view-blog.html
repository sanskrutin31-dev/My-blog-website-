
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Blog - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h2>MyBlog</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<section class="create-section">

    <h1 id="title">Loading Blog...</h1>

    <p id="author"></p>

    <p id="content"></p>

    <a href="dashboard.html">
        <button>Back to Dashboard</button>
    </a>

</section>

<script>
async function loadBlog() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!id) {
        document.getElementById("title").textContent = "Blog Not Found";
        return;
    }

    try {
        const response = await fetch(
            `http://localhost:5000/api/blogs/${encodeURIComponent(id)}`
        );

        if (!response.ok) {
            throw new Error("Blog not found");
        }

        const blog = await response.json();

        document.getElementById("title").textContent = blog.title;

        document.getElementById("author").textContent =
            "Written by: " + (blog.author || "Unknown");

        document.getElementById("content").textContent = blog.content;

    } catch (error) {
        document.getElementById("title").textContent = "Blog Not Found";
        document.getElementById("author").textContent = "";
        document.getElementById("content").textContent = "";

        console.error(error);
    }
}

loadBlog();
</script>

</body>
</html>
