
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Blog - MyBlog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h2>MyBlog</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
    </nav>
</header>

<section class="create-section">

    <h1 id="title">Blog Title</h1>

    <p id="author"></p>

    <p id="content"></p>

    <a href="dashboard.html">
        <button>Back to Dashboard</button>
    </a>

</section>

<script>

const blogs = JSON.parse(
    localStorage.getItem("blogs")
) || [];

const params = new URLSearchParams(window.location.search);
const id = Number(params.get("id"));

if (
    params.get("id") === null ||
    !Number.isInteger(id) ||
    id < 0 ||
    id >= blogs.length
) {
    document.getElementById("title").textContent = "Blog Not Found";
    document.getElementById("author").textContent = "";
    document.getElementById("content").textContent = "";
} else {

    const blog = blogs[id];

    document.getElementById("title").textContent = blog.title;
    document.getElementById("author").textContent =
        "Written by: " + (blog.author || "Unknown");

    document.getElementById("content").textContent = blog.content;

}

</script>

</body>
</html>
